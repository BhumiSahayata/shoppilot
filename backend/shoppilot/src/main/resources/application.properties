spring.application.name=shoppilot


# Backward compatibility alias
spring.data.mongodb.uri=${spring.mongodb.uri}
spring.data.mongodb.database=${spring.mongodb.database}

# Razorpay Test Mode Configuration (Passed via ENV or properties)
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# Optional External AI API Configuration (Falls back safely to DeterministicFallbackEngine)
ai.api.key=${AI_API_KEY:}
ai.api.url=${AI_API_URL:https://api.openai.com/v1/chat/completions}
