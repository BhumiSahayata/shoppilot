<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopPilot — AI Shopping Assistant</title>
    <meta name="description" content="ShopPilot is an AI-powered shopping assistant that understands your needs, recommends the right products, and helps you complete your purchase securely." />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#eef2ff',
                100: '#e0e7ff',
                200: '#c7d2fe',
                400: '#818cf8',
                500: '#6366f1',
                600: '#4f46e5',
                700: '#4338ca',
                800: '#3730a3',
                900: '#312e81',
              }
            },
            keyframes: {
              fadeIn: {
                from: { opacity: '0', transform: 'translateY(8px)' },
                to: { opacity: '1', transform: 'translateY(0)' }
              },
              slideUp: {
                from: { opacity: '0', transform: 'translateY(16px)' },
                to: { opacity: '1', transform: 'translateY(0)' }
              },
              shimmer: {
                '0%': { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' }
              }
            },
            animation: {
              fadeIn: 'fadeIn 0.3s ease-out',
              slideUp: 'slideUp 0.4s ease-out',
              shimmer: 'shimmer 1.5s infinite linear'
            }
          }
        }
      }
    </script>
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Razorpay Checkout Script (Test Mode) -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
      body { font-family: 'Inter', sans-serif; }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
